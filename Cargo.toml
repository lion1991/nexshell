[package]
name = "nexshell"
version = "0.5.0"
edition = "2021"
publish = false

[features]
default = ["warpui-app"]
# text_editor 残留 cfg（voice 已砍 / settings 宏内部 integration_tests）：声明以消 check-cfg 警告，默认关、不激活。
voice_input = []
integration_tests = []
# 实际运行的应用 feature：拉入 warpui + warpui_core（皆 MIT），在 macOS 上
# 同时把 warp 的整个平台层 (cocoa/metal/font-kit/objc) 间接拉入。
warpui-app = ["dep:settings", "dep:warp_editor", "dep:warpui", "dep:warpui_core", "dep:warpui_extras", "dep:warp_terminal", "dep:warp_util", "dep:pathfinder_color", "dep:pathfinder_geometry", "dep:warp_core", "dep:schemars", "dep:settings_value", "dep:vim", "dep:sum_tree", "dep:string-offset", "dep:vec1", "dep:arrayvec", "dep:smallvec", "dep:num-traits", "dep:itertools", "dep:instant", "dep:bounded-vec-deque", "dep:uuid", "dep:rayon", "dep:concat-idents", "dep:cfg-if", "dep:mime_guess", "dep:async-fs", "dep:futures", "dep:rangemap", "dep:similar", "dep:line-ending", "dep:syntax_tree", "dep:languages"]

[dependencies]
alacritty_terminal = "0.25"
anyhow = "1.0"
# 原 =2.9.4 死钉；ironrdp-pdu 需要 ^2.11，放宽到 2.11+（bitflags 2.x 语义稳定、纯增量）。
bitflags = "2.11"
portable-pty = "0.8"
rusqlite = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# 用于判断 IME marked text 字符的列宽（CJK 占 2 cell），与 Warp
# `grid_renderer.rs:653` 调 `width()` 的语义一致。
unicode-width = "0.2"
# PTY event loop 完全按 Warp 来：mio 接 master fd + signal_hook_mio 接 SIGCHLD
# + parking_lot::FairMutex 让 PTY 写线程主动让锁、main 线程读 snapshot 不卡。
# 版本与 warp/app/Cargo.toml 完全对齐。
mio = { version = "1.1.1", features = ["os-poll", "os-ext"] }
parking_lot = "0.12.1"
async-channel = "2.3.1"
futures-lite = "1.13.0"
log = "0.4"
# util::bindings 本地化所需：CustomAction derive(Sequence) + CUSTOM_TAG_TO_ACTION，版本对齐 warp。
enum-iterator = "1.5"
lazy_static = "1.5"
rust-i18n = "4"
sys-locale = "0.3"
async-trait = "0.1"
russh = "0.46"
russh-sftp = "2.1"
ssh-key = "0.6"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "io-util", "fs"] }
# IronRDP 内部日志（tracing）出口：设 RUST_LOG 时才初始化，平时零开销。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 加密导出（主机库导出文件）：AES-256-GCM + PBKDF2-HMAC-SHA256
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
serialport = "4.9.0"
# RDP 远程桌面：纯 Rust IronRDP（见 docs/adr/0007-rdp-via-ironrdp.md）。
# 协议层无 UI 依赖、跨平台，故常开不进 warpui-app feature。
# TLS 走 ironrdp-tls 的 rustls backend，复用树内 rustls 0.23，不引 OpenSSL。
ironrdp-connector = "0.9"
ironrdp-session = "0.10"
ironrdp-graphics = "0.8"
ironrdp-pdu = "0.8"
ironrdp-core = "0.2"
ironrdp-async = "0.9"
ironrdp-tokio = "0.9"
ironrdp-tls = { version = "0.2", default-features = false, features = ["rustls"] }
# CLIPRDR 剪贴板通道（见 docs/adr/0007 第⑤步）。0.6.0 依赖 pdu 0.8/svc 0.7/core 0.2，
# 与树内 connector 0.9/session 0.10 完全一致。cliprdr-native 只有 windows 后端、macOS 仅 stub，
# 故不引 native，自实现 CliprdrBackend + arboard 访问 Mac 剪贴板。
ironrdp-cliprdr = "0.6"
# EGFX 图形管线（MS-RDPEGFX，见 docs/adr/0008）。dvc 0.7 承载动态虚拟通道，
# egfx 0.2 是 EGFX DVC 处理器。不开 openh264 feature（解码走 VideoToolbox，第②步）。
ironrdp-dvc = "0.7"
ironrdp-egfx = "0.2"
ironrdp-svc = "0.7"
# Display Control 动态通道（MS-RDPEDISP，见 docs/adr/0008）：窗口尺寸/全屏变化时
# 实时重设远端分辨率，消除 letterbox 黑边。0.7.0 依赖 dvc 0.7/svc 0.7/pdu 0.8/core 0.2，与树内一致。
ironrdp-displaycontrol = "0.7"
# RDPSND 音频重定向（仅输出方向）：rdpsnd 0.8 协议层 + rdpsnd-native 0.6 cpal 播放后端
# （默认 feature 含 Opus 解码）。与树内 pdu 0.8/svc 0.7/core 0.2 一致。
ironrdp-rdpsnd = "0.8"
ironrdp-rdpsnd-native = "0.6"
# RDPDR 设备重定向通道；音频开启时只挂 no-op 后端，用于满足 rdpsnd 的通道依赖。
ironrdp-rdpdr = "0.6"
# Mac/跨平台剪贴板文本读写。default-features=false 去掉 image-data（不引 image crate）；
# macOS 走 objc2-app-kit NSPasteboard，与 warp 的 objc 0.2/cocoa 栈相互独立、无冲突。
# 只在单一 RDP 线程访问 NSPasteboard，无并发。
arboard = { version = "3.6", default-features = false }
# 只为在 RDP 连接前显式 install_default crypto provider（树内两 provider 共存，
# 不指定 rustls builder 会 panic）。ring 已在树，零新增编译量。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# git 面板用：监听仓库 .git/ 与工作区变化触发自动刷新。Warp 同款思路，
# 用 upstream crates.io 版本即可，不引入 fork。
notify-debouncer-full = "0.3"
# text_editor 核心数据结构依赖（CRDT buffer / display_map，砍 ai/image/voice 后仍需要），版本对齐 Cargo.lock。
vec1 = { version = "1.12", features = ["serde"], optional = true }
arrayvec = { version = "0.7", optional = true }
smallvec = { version = "1", optional = true }
num-traits = { version = "0.2", optional = true }
itertools = { version = "0.10", optional = true }
instant = { version = "0.1", features = ["wasm-bindgen"], optional = true }
bounded-vec-deque = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
rayon = { version = "1", optional = true }
# editor 本地化补依赖：settings 宏裸用 concat_idents::；element/settings 用 cfg-if；mod.rs 用 mime_guess/async-fs。
concat-idents = { version = "1.1.4", optional = true }
cfg-if = { version = "1.0.0", optional = true }
mime_guess = { version = "2.0", optional = true }
async-fs = { version = "2.1.2", optional = true }
# code_editor 本地化补依赖：diff/model 用 futures/rangemap/similar，行尾用 line-ending。
futures = { version = "0.3", features = ["executor", "thread-pool"], optional = true }
rangemap = { version = "1.3.0", optional = true }
similar = { version = "2.7", features = ["inline"], optional = true }
line-ending = { version = "1.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = { git = "https://github.com/warpdotdev/rust-objc.git", rev = "5b656827fa9f863ef0eb22e444a3fedac009e78a" }
core-text = "21.0.0"
# EGFX H.264 硬解（docs/adr/0008 第②步）：VideoToolbox 纯系统框架，objc2 0.6 生态已在树
# （app-kit/foundation 皆 0.3.x 系）。framework crate 高度 feature-gated，按用到的类型开。
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFCGTypes", "CFNumber"] }
objc2-core-media = { version = "0.3", features = ["std", "CMBase", "CMTime", "CMFormatDescription", "CMBlockBuffer", "CMSampleBuffer"] }
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVReturn", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-video-toolbox = { version = "0.3", features = ["std", "objc2", "objc2-core-media", "objc2-core-video", "VTDecompressionSession", "VTDecompressionProperties", "VTSession", "VTErrors"] }

[target.'cfg(target_os = "windows")'.dependencies]
font-kit = { git = "https://github.com/warpdotdev/font-kit", rev = "a04b225ecb639bb850f21d05212cfdc7465000f3", default-features = false, features = ["source"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3.17"
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"] }

[target.'cfg(any(unix, windows))'.dependencies]
# Warp UI crates are consumed as path dependencies so the Warp workspace does
# not need to include this spike as a member.
settings = { path = "../warp/crates/settings", optional = true }
# schema_gen/settings_value：JsonSchema+SettingsValue derive（原靠 warp app 传播，删后须自启）。
warpui = { path = "../warp/crates/warpui", features = ["schema_gen", "settings_value"], optional = true }
warpui_core = { path = "../warp/crates/warpui_core", optional = true }
warpui_extras = { path = "../warp/crates/warpui_extras", optional = true, default-features = false }
warp_editor = { path = "../warp/crates/editor", optional = true }
warp_terminal = { path = "../warp/crates/warp_terminal", optional = true }
warp_util = { path = "../warp/crates/warp_util", optional = true }
# pathfinder_color / pathfinder_geometry 是 warpui scene API（Vector2F、RectF、ColorU）
# 的来源；warpui 内部用，我们写自定义 Element 时也直接需要它们。
pathfinder_color = { version = "0.5", optional = true }
pathfinder_geometry = { version = "0.5.1", optional = true }
warp_core = { path = "../warp/crates/warp_core", optional = true }
# themes 本地化：ThemeKind/CustomTheme 的 schemars::JsonSchema + settings_value::SettingsValue derive。
schemars = { version = "1", optional = true }
settings_value = { path = "../warp/crates/settings_value", features = ["derive"], default-features = false, optional = true }
# editor 本地化：text_editor 的 vim_model 依赖纯净的 vim crate（无 ai/app/网络）。
vim = { path = "../warp/crates/vim", optional = true }
sum_tree = { path = "../warp/crates/sum_tree", optional = true }
string-offset = { path = "../warp/crates/string-offset", optional = true }
# code_editor 语法高亮：syntax_tree(tree-sitter) + languages(语言识别)，删 warp app 后仍是独立 crate。
syntax_tree = { path = "../warp/crates/syntax_tree", optional = true }
languages = { path = "../warp/crates/languages", optional = true }

[[bin]]
name = "nexshell"
path = "src/main.rs"
required-features = ["warpui-app"]

[dev-dependencies]
tempfile = "3"
# rdp_probe 探针把 framebuffer 落盘成 PNG 验证（仅验证用，运行期喂 warpui RGBA）。
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
cc = "1"
embed-resource = "3"

[patch.crates-io]
# Keep Warp's patched CoreText/CoreGraphics stack active even though this
# spike is intentionally outside the Warp workspace. Without this, font-kit
# sees CGFont from two core-graphics versions and fails with E0308.
core-foundation = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-foundation-sys = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-graphics = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
core-text = { git = "https://github.com/servo/core-foundation-rs", rev = "6f844cf1a1a18e25b70fcdf1bcdc458555bd2eff" }
objc = { git = "https://github.com/warpdotdev/rust-objc.git", rev = "5b656827fa9f863ef0eb22e444a3fedac009e78a" }
yaml-rust = { git = "https://github.com/warpdotdev/yaml-rust.git", rev = "51684719d0102ca85ff4b21cec39877a0c669e19" }

# IronRDP fork（docs/adr/0008）：保留 EGFX/ClearCodec 修复，并包含 rdpsnd 音频协商修复。
# git workspace 内部是同一组 crate，只 patch 单个 crate 会与 crates.io 拉的其余 ironrdp crate
# 出现同名两份导致类型不匹配。故把树内用到的全部 ironrdp crate 统一钉到同一 fork rev。
ironrdp-async = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-bulk = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-cliprdr = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-connector = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-core = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-displaycontrol = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-dvc = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-egfx = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-error = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-graphics = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-pdu = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-rdpsnd = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-rdpsnd-native = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-rdpdr = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-session = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-svc = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-tls = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }
ironrdp-tokio = { git = "https://github.com/lion1991/IronRDP.git", rev = "6908d0c0050162f95b3b1c3d1fdf6d53e100fc25" }

# debug 构建只优化依赖（本 crate 保持 debug 可断点）：RDP 视频软解热点（RLGR/IDWT）
# 在 fork ironrdp-graphics 里，无优化时慢 20-50 倍致 cargo run 下视频卡帧。
# 依赖编译一次即缓存，增量编译速度不受影响。
[profile.dev.package."*"]
opt-level = 3
# 依赖不带 DWARF：不进依赖断点，换 debug 产物瘦身+链接提速。panic 回溯中依赖帧只剩
# 函数名无行号；要深挖某依赖时临时对该包单独开回 debug = true。
debug = false
